  const log = document.getElementById('log');
  const bar = document.getElementById('bar');
  const prog = document.getElementById('progress');

  function addLog(msg, cls='info') {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = msg;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById('btnClear').onclick = () => { log.innerHTML = ''; };

  document.getElementById('btnStart').onclick = async () => {
    const btn = document.getElementById('btnStart');
    btn.disabled = true;
    btn.textContent = '⏳ 진행 중...';

    let dirHandle;
    try {
      dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    } catch(e) {
      addLog('폴더 선택 취소됨', 'err');
      btn.disabled = false;
      btn.textContent = '📁 폴더 선택 후 다운로드 시작';
      return;
    }

    bar.style.display = 'block';
    bar.max = IMAGES.length;
    let ok = 0, fail = 0;

    for (let i = 0; i < IMAGES.length; i++) {
      const [url, fname] = IMAGES[i];
      bar.value = i + 1;
      prog.textContent = `진행: ${i+1} / ${IMAGES.length} (성공: ${ok}, 실패: ${fail})`;

      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        const fh = await dirHandle.getFileHandle(fname, { create: true });
        const writable = await fh.createWritable();
        await writable.write(blob);
        await writable.close();
        ok++;
        addLog(`✓ ${fname}`, 'ok');
      } catch(e) {
        fail++;
        addLog(`✗ ${fname} — ${e.message}`, 'err');
      }
    }

    prog.textContent = `🎉 완료! 성공 ${ok} / 실패 ${fail} / 총 ${IMAGES.length}`;
    btn.textContent = '✅ 완료';
    addLog(`\n완료: 성공 ${ok}, 실패 ${fail}`, ok > 0 ? 'ok' : 'err');
  };
